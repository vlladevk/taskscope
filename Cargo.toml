[workspace]
resolver = "2"
members = ["crates/tm-core", "crates/tm-cli", "crates/tm-app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
windows-sys = "0.59"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
